<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cassette Player</title>
  <base href="https://www.kanpekiuniverse.com/widgets/music/casete/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://www.kanpekiuniverse.com/widgets/shared/css/base.css">
  <link rel="stylesheet" href="https://www.kanpekiuniverse.com/widgets/music/casete/style.css">
</head>
<body>
<div class="cassette-widget" id="cassette-player-wrapper">
  <div class="scene">
    <div class="flipper" id="flipper">
      <!-- ══════════ LADO A ══════════ -->
      <div class="face face-a">
        <div class="cassette" id="cassetteBody">
          <span class="screw tl"></span><span class="screw tr"></span>
          <span class="screw bl"></span><span class="screw br"></span>
          <div class="tape-label">
            <div class="tape-title" id="tapeTitle" contenteditable="true" spellcheck="false" aria-label="Mixtape">Love Songs</div>
          </div>
          <div class="tape-stripe" id="tapeStripe">
            <span class="badge-a">A</span>
            <span class="badge-60">60</span>
            <div class="reel-plate">
              <div class="reel"><div class="teeth"></div></div>
              <div class="tape-window">
                <div class="spool"></div>
                <div class="gap"></div>
                <div class="spool"></div>
              </div>
              <div class="reel"><div class="teeth"></div></div>
            </div>
          </div>
          <div class="tape-footer">
            <div class="now-playing" id="nowPlaying">pon play para empezar ♪</div>
            <span class="audio-tape">AUDIO TAPE</span>
          </div>
          <div class="tape-progress" id="tapeProgress" role="slider" tabindex="0" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="fill" id="progressFill"></div>
          </div>
          <div style="height:10px"></div>
        </div>
        <div class="tape-base">
          <button class="hole-btn" id="btnPrev" aria-label="Anterior" title="Anterior">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="hole-btn play-btn" id="btnPlay" aria-label="Reproducir" title="Reproducir">
            <svg viewBox="0 0 24 24" id="iconPlay"><path d="M8 5v14l11-7z"/></svg>
            <svg viewBox="0 0 24 24" id="iconPause" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button class="hole-btn" id="btnNext" aria-label="Siguiente" title="Siguiente">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <div class="vol-wrap">
            <input type="range" id="volSlider" min="0" max="100" value="60" aria-label="Volumen">
          </div>
          <button class="hole-btn flip-btn" id="btnFlipB" aria-label="Ir al lado B" title="Lado B">
            B
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100" height="100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" /></svg>
          </button>
        </div>
      </div>
      <!-- ══════════ LADO B ══════════ -->
      <div class="face face-b">
        <div class="side-b">
          <div class="side-b-header">
            <button class="back-btn" id="btnFlipA">
              <span aria-hidden="true">◀</span> <span data-i18n="back">VOLVER AL LADO A</span>
            </button>
            <div class="sb-header-right">
              <button class="lang-btn" id="langBtn" aria-label="Idioma / Language">ES</button>
              <span class="badge-b">B</span>
            </div>
          </div>
          <div class="video-window">
            <div id="ytPlayer"></div>
          </div>
          <details class="sb-collapse">
            <summary class="sb-summary">
              <span data-i18n="options">Opciones</span>
              <span class="chev" aria-hidden="true">▾</span>
            </summary>
            <div class="sb-body">
              <div class="link-row">
                <input type="text" id="linkInput" placeholder="pega tu link de YouTube (video o playlist)" aria-label="Link de YouTube">
                <button id="btnLoad">CARGAR</button>
              </div>
              <div class="loop-row">
                <span class="lbl">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
                  <span>REPETIR (BUCLE)</span>
                </span>
                <label class="switch">
                  <input type="checkbox" id="loopToggle" aria-label="Repetir en bucle">
                  <span class="track"></span>
                </label>
              </div>
              <div class="theme-block">
                <span class="lbl">Tema</span>
                <div class="theme-grid" id="themeGrid"></div>
              </div>
            </div>
          </details>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 注入隔離腳本：將 localStorage 鍵值自動綁定網址中的 ?id= 參數 -->
<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const widgetId = params.get('id') || 'default';
    const rawSetItem = localStorage.setItem.bind(localStorage);
    const rawGetItem = localStorage.getItem.bind(localStorage);

    localStorage.setItem = function(key, val) {
      return rawSetItem(widgetId + '_' + key, val);
    };
    localStorage.getItem = function(key) {
      return rawGetItem(widgetId + '_' + key);
    };
  })();
</script>

<script src="https://www.kanpekiuniverse.com/widgets/shared/js/widget-detector.js"></script>
<script src="https://www.kanpekiuniverse.com/widgets/shared/js/base.js"></script>
<script src="https://www.kanpekiuniverse.com/widgets/shared/js/widget-params.js"></script>
<script src="https://www.kanpekiuniverse.com/widgets/music/casete/script.js"></script>
</body>
</html>
